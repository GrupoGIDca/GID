<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GID Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070c0e;--bg2:#0d1518;--bg3:#131f22;--border:#213130;
  --green:#2fe6a6;--green2:#12b981;--muted:#6f918b;
  --text:#eafff7;--text2:#9db8b1;
  --red:#fb7185;--amber:#fbbf24;--blue:#5ac8fa;--gold:#f5c451;
  --r:10px;--font:'Inter',sans-serif;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.45);
  --glow-green:0 0 0 1px rgba(47,230,166,.15),0 0 24px rgba(47,230,166,.08);
}
html,body{height:100%;background:
  radial-gradient(1200px 600px at 10% -10%,rgba(47,230,166,.05),transparent 60%),
  radial-gradient(900px 500px at 100% 0%,rgba(96,184,240,.04),transparent 55%),
  var(--bg);
  color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
::selection{background:rgba(47,230,166,.25);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
:focus-visible{outline:2px solid rgba(47,230,166,.5);outline-offset:2px}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;height:100vh;
  background:
    radial-gradient(700px 400px at 50% 0%,rgba(47,230,166,.10) 0%,transparent 65%),
    radial-gradient(ellipse at 50% 100%,#0c1719 0%,#05090b 75%);
  position:relative;overflow:hidden}
#login-screen::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(47,230,166,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(47,230,166,.035) 1px,transparent 1px);
  background-size:42px 42px;mask-image:radial-gradient(600px 500px at 50% 40%,#000 0%,transparent 75%)}
.lcard{position:relative;width:340px;padding:44px 36px;background:linear-gradient(180deg,var(--bg2),var(--bg));
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg),var(--glow-green);
  animation:lcard-in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes lcard-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.llogo{font-size:38px;font-weight:300;letter-spacing:7px;color:#fff;margin-bottom:4px;
  text-shadow:0 0 30px rgba(47,230,166,.25)}
.llogo span{color:var(--green)}
.lsub{font-size:10px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:32px}
.llabel{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block}
.linput{width:100%;padding:11px 13px;background:rgba(0,0,0,.25);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.linput:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,230,166,.12)}
.lbtn{width:100%;margin-top:24px;padding:12px;background:linear-gradient(135deg,var(--green),var(--green2));border:none;border-radius:var(--r);
  color:#06120a;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 14px rgba(47,230,166,.25)}
.lbtn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(47,230,166,.35)}
.lbtn:active{transform:translateY(0)}
.lerr{margin-top:12px;font-size:12px;color:var(--red);text-align:center;min-height:16px}

/* APP */
#app{display:none;height:100vh;flex-direction:row}
.sidebar{width:222px;flex-shrink:0;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:0;box-shadow:2px 0 20px rgba(0,0,0,.2)}
.s-logo{padding:24px 20px;border-bottom:1px solid var(--border)}
.s-logo .lt{font-size:22px;font-weight:300;letter-spacing:5px;text-shadow:0 0 20px rgba(47,230,166,.15)}
.s-logo .ld{color:var(--green)}
.s-logo .ls{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.s-user{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.s-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;color:#06120a;flex-shrink:0;box-shadow:0 0 0 2px rgba(47,230,166,.15)}
.s-avatar.victor{background:linear-gradient(135deg,var(--blue),#3a8fd6);box-shadow:0 0 0 2px rgba(96,184,240,.15)}
.s-uname{font-size:12px;font-weight:600;color:var(--text)}
.s-urole{font-size:10px;color:var(--muted)}
.s-nav{flex:1;padding:12px 0;overflow-y:auto}
.ns{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:8px 20px 4px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;font-size:13px;
  color:var(--text2);border-left:2px solid transparent;transition:all .15s;user-select:none}
.ni:hover{color:var(--text);background:rgba(47,230,166,.06)}
.ni.active{color:var(--green);border-left-color:var(--green);background:linear-gradient(90deg,rgba(47,230,166,.10),transparent);font-weight:500}
.ni .ico{font-size:15px;width:18px;text-align:center}
.s-foot{padding:16px 20px;border-top:1px solid var(--border)}
.lout{width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:var(--r);
  color:var(--muted);font-family:var(--font);font-size:12px;cursor:pointer;transition:all .15s}
.lout:hover{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.06)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;background:rgba(17,31,22,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:.2px}
.topbar-date{font-size:11px;color:var(--muted)}
.content{padding:28px;flex:1}
.page{display:none}
.page.active{display:block;animation:page-in .25s ease}
@keyframes page-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kcard{background:linear-gradient(160deg,var(--bg2),var(--bg3) 140%);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s,border-color .18s}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#2a4a33}
.kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),transparent 90%)}
.kcard.red::before{background:linear-gradient(90deg,var(--red),transparent 90%)}
.kcard.amber::before{background:linear-gradient(90deg,var(--amber),transparent 90%)}
.kcard.blue::before{background:linear-gradient(90deg,var(--blue),transparent 90%)}
.klbl{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.kval{font-size:25px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.3px;
  color:var(--text);background:linear-gradient(180deg,#ffffff,var(--green) 240%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kcard.amber .kval{background:linear-gradient(180deg,#fff,var(--gold) 240%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kcard.blue .kval{background:linear-gradient(180deg,#fff,var(--blue) 240%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ksub{font-size:11px;color:var(--text2);margin-top:4px}

/* CHARTS */
.cgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.ccard{background:linear-gradient(160deg,var(--bg2),var(--bg3) 160%);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow-sm)}
.ctitle{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:16px}

/* TABLE */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stitle{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.tw{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse}
thead tr{background:#081209}
th{padding:11px 16px;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;text-align:left;font-weight:600}
td{padding:11px 16px;font-size:13px;border-top:1px solid var(--border);color:var(--text2);transition:color .15s}
tbody tr{position:relative;transition:background .15s}
tbody tr:hover{background:rgba(47,230,166,.035)}
tbody tr:hover td{color:var(--text)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.2px}
.bg{background:rgba(47,230,166,.15);color:var(--green);box-shadow:inset 0 0 0 1px rgba(47,230,166,.2)}
.ba{background:rgba(251,191,36,.15);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(251,191,36,.2)}
.br{background:rgba(248,113,113,.15);color:var(--red);box-shadow:inset 0 0 0 1px rgba(248,113,113,.2)}
.bb{background:rgba(96,184,240,.15);color:var(--blue);box-shadow:inset 0 0 0 1px rgba(96,184,240,.2)}

/* BUTTONS */
.btn{padding:8px 16px;border:none;border-radius:var(--r);font-family:var(--font);font-size:12px;
  font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .12s,border-color .12s,background .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-g{background:linear-gradient(135deg,var(--green),var(--green2));color:#06120a;box-shadow:0 2px 10px rgba(47,230,166,.2)}
.btn-g:hover{box-shadow:0 4px 16px rgba(47,230,166,.3)}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-o:hover{border-color:var(--green);color:var(--green);background:rgba(47,230,166,.05)}
.btn-r{background:rgba(248,113,113,.13);border:1px solid var(--red);color:var(--red)}
.btn-r:hover{background:rgba(248,113,113,.2);box-shadow:0 4px 14px rgba(248,113,113,.15)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(3,8,5,.75);backdrop-filter:blur(3px);z-index:100;
  align-items:center;justify-content:center}
.modal-overlay.open{display:flex;animation:modal-bg-in .15s ease}
@keyframes modal-bg-in{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(165deg,var(--bg2),var(--bg));border:1px solid var(--border);border-radius:14px;
  width:520px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:var(--shadow-lg);
  animation:modal-in .2s cubic-bezier(.2,.8,.2,1)}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-title{font-size:15px;font-weight:600;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.modal-close{cursor:pointer;color:var(--muted);font-size:18px;background:none;border:none;color:var(--muted);transition:color .15s}
.modal-close:hover{color:var(--red)}
.fgroup{margin-bottom:16px}
.flabel{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block}
.finput{width:100%;padding:9px 12px;background:rgba(0,0,0,.2);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.finput:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,230,166,.1)}
select.finput{cursor:pointer}
/* Fix: los <option> de las listas heredaban fondo blanco del sistema y con
   texto claro quedaban ilegibles (blanco sobre blanco). Se fuerzan al tema
   oscuro para que se lean bien al desplegar el menú. */
select.finput option, .linput option, select option{
  background:var(--bg2); color:var(--text);
}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.factions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* COMISION CARD */
.com-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;transition:border-color .15s}
.com-card:hover{border-color:#2a4a33}
.com-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.com-detail{font-size:11px;color:var(--muted)}
.com-amount{font-size:18px;font-weight:300;color:var(--green);margin-top:6px}


/* ── TICKER MERCADO ─────────────────────────────────────── */
.ticker-wrap {
  position: sticky;
  top: 0;
  z-index: 20;
  overflow: hidden;
  background: #060d08;
  border-bottom: 1px solid #1e3524;
  padding: 5px 0;
  white-space: nowrap;
}
.ticker-wrap::before, .ticker-wrap::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 40px;
  z-index: 2;
  pointer-events: none;
}
.ticker-wrap::before { left: 0; background: linear-gradient(to right, #060d08, transparent); }
.ticker-wrap::after  { right: 0; background: linear-gradient(to left, #060d08, transparent); }
.ticker-track {
  display: inline-flex;
  animation: ticker-scroll 35s linear infinite;
}
.ticker-track:hover { animation-play-state: paused; }
@keyframes ticker-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 20px;
  border-right: 1px solid #1e3524;
  font-size: 11px;
}
.ticker-label { color: #6b8f6b; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
.ticker-value { color: #eef8ee; font-weight: 600; }
.ticker-change { font-size: 10px; font-weight: 700; }
.ticker-change.pos { color: #2fe6a6; }
.ticker-change.neg { color: #f87171; }
.ticker-dot { width: 5px; height: 5px; border-radius: 50%; background: #2fe6a6; flex-shrink: 0; box-shadow:0 0 6px rgba(47,230,166,.6); }
.ticker-dot.amber { background: #fbbf24; box-shadow:0 0 6px rgba(251,191,36,.6); }
.ticker-dot.blue { background: #60b8f0; box-shadow:0 0 6px rgba(96,184,240,.6); }
/* ticker-visible: sin padding, el ticker ya es sticky dentro del main */
/* MARKET CARDS */
.m-card{background:linear-gradient(160deg,var(--bg2),var(--bg3) 160%);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;
  transition:transform .15s;box-shadow:var(--shadow-sm)}
.m-card:hover{transform:translateY(-1px)}
.m-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),transparent 90%)}
.m-card.red::before{background:linear-gradient(90deg,var(--red),transparent 90%)}
.m-card.blue::before{background:linear-gradient(90deg,var(--blue),transparent 90%)}
.m-card.amber::before{background:linear-gradient(90deg,var(--amber),transparent 90%)}
.m-change{font-size:11px;font-weight:600;margin-top:4px}
.m-change.pos{color:var(--green)}
.m-change.neg{color:var(--red)}

/* VICTOR VIEW */
.vic-header{background:linear-gradient(160deg,var(--bg2),var(--bg3) 160%);border:1px solid var(--border);border-radius:12px;
  padding:20px;margin-bottom:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm)}
.vic-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#3a8fd6);display:flex;
  align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#06120a;flex-shrink:0;box-shadow:0 0 0 3px rgba(96,184,240,.15)}

/* ── MOBILE MENU TOGGLE ─────────────────────────────────────── */
.mob-bar{display:none;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.mob-logo{font-size:20px;font-weight:300;letter-spacing:4px;color:#fff}
.mob-logo span{color:var(--green)}
.mob-toggle{background:none;border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:6px 10px;font-size:16px;cursor:pointer;transition:border-color .15s}
.mob-toggle:hover{border-color:var(--green)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:29}
.sidebar-overlay.open{display:block}

/* ── RESPONSIVE ─────────────────────────────────────────────── */
@media(max-width:768px){
  /* Login */
  .lcard{width:92vw;padding:28px 20px}

  /* App layout */
  #app{flex-direction:column;height:auto;min-height:100vh}
  .mob-bar{display:flex}
  .sidebar{
    position:fixed;top:0;left:-100%;width:240px;height:100vh;
    z-index:30;transition:left .25s ease;overflow-y:auto
  }
  .sidebar.open{left:0}
  .main{flex:1;overflow-y:auto}
  .topbar{display:none}
  .content{padding:16px}

  /* KPI grid → 2 columns */
  .kgrid{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .kval{font-size:18px}

  /* Charts → stack */
  .cgrid{grid-template-columns:1fr;gap:12px}

  /* Tables → horizontal scroll */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:520px}
  th,td{padding:8px 10px;font-size:12px}

  /* Section headers */
  .sh{flex-direction:column;align-items:flex-start;gap:8px}

  /* Modals → full screen on mobile */
  .modal-overlay{align-items:flex-end}
  .modal{width:100%;max-width:100%;border-radius:12px 12px 0 0;
    max-height:92vh;overflow-y:auto;padding:20px 16px}

  /* Form rows → single column */
  .frow{grid-template-columns:1fr}

  /* Receipt grid → single column */
  .receipt-grid{grid-template-columns:1fr}

  /* Com cards → single column */
  .com-cards-grid{grid-template-columns:1fr}

  /* Payment cards action buttons */
  .pago-actions{flex-direction:column}
  .pago-actions button{width:100%}

  /* Botones de acción en tabla */
  td .btn{font-size:10px;padding:3px 6px}
}

@media(max-width:400px){
  .kgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ══════ OVERLAY BLOQUEANTE DE OPERACIONES CRÍTICAS ══════
     Cubre TODA la pantalla mientras algo se está guardando en Sheets.
     No se puede hacer clic en nada de abajo mientras está visible. -->
<div id="critical-overlay" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(4,10,5,.97);flex-direction:column;align-items:center;justify-content:center;color:#e8f5e8;font-family:'Inter',sans-serif;text-align:center;padding:24px">
  <div id="co-spinner" style="width:60px;height:60px;border:5px solid #1e3a1e;border-top-color:#2fe6a6;border-radius:50%;animation:co-spin .8s linear infinite;margin-bottom:26px"></div>
  <div id="co-icon" style="font-size:52px;margin-bottom:18px;display:none;line-height:1"></div>
  <div id="co-titulo" style="font-size:19px;font-weight:600;letter-spacing:1.5px;margin-bottom:12px;text-transform:uppercase">PROCESANDO</div>
  <div id="co-detalle" style="font-size:14px;color:#9cb89c;max-width:440px;line-height:1.6">Iniciando…</div>
  <div id="co-pasos" style="margin-top:20px;font-size:11px;color:#6b8f6b;max-width:440px;text-align:left"></div>
  <div id="co-timer" style="font-size:11px;color:#6b8f6b;margin-top:18px;min-height:14px"></div>
  <div id="co-acciones" style="margin-top:22px;display:none;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-g" onclick="coReintentar()">↻ Reintentar</button>
    <button class="btn btn-o" style="border-color:#f87171;color:#f87171" onclick="coForzarCerrar()">Cerrar sin confirmar (riesgo)</button>
  </div>
  <div style="position:absolute;bottom:18px;font-size:10px;color:#3d5a3d;max-width:400px">No cierres esta pestaña ni la app mientras veas esta pantalla — evita que el dato se pierda entre dispositivos.</div>
</d
